is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

set -g prefix M-a
unbind C-b
bind-key M-a send-prefix

# Session switch

bind-key -n C-M-1 run-shell "~/switch-tmux-session.sh 1"
bind-key -n C-M-2 run-shell "~/switch-tmux-session.sh 2"
bind-key -n C-M-3 run-shell "~/switch-tmux-session.sh 3"
bind-key -n C-M-4 run-shell "~/switch-tmux-session.sh 4"
bind-key -n C-M-5 run-shell "~/switch-tmux-session.sh 5"
bind-key -n C-M-6 run-shell "~/switch-tmux-session.sh 6"
bind-key -n C-M-7 run-shell "~/switch-tmux-session.sh 7"
bind-key -n C-M-8 run-shell "~/switch-tmux-session.sh 8"
bind-key -n C-M-9 run-shell "~/switch-tmux-session.sh 9"
###

# Paste from system clipboard with Ctrl+V (only if not in vim, would interfere with visual block mode)
bind -n C-v if-shell "$is_vim" "send-keys C-v" "run-shell 'wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer -p'"

# b is free

unbind %
bind v split-window -h -c "#{pane_current_path}"

bind \\ source-file ~/.tmux.conf

unbind '"'
bind h split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

unbind r
bind r switch-client -l

bind g new-session -c "#{pane_current_path}"

unbind t
bind t "send-keys 'exit' Enter"

unbind m
bind m set -g status

unbind f
bind f display-popup -w 80% -h 80% -d '#{pane_current_path}' 

#window resize allow multiple keypress
bind -r Left resize-pane -L 2
bind -r Down resize-pane -D 2
bind -r Up resize-pane -U 2
bind -r Right resize-pane -R 2

# OSC 52 as a fallback; it also works over ssh
set -g set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard'

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi 'Enter' send -X copy-pipe-and-cancel "wl-copy"

# mouse drag copies to clipboard but stays in copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "wl-copy"

# tmux - nvim window switch
bind -n Left if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n Down if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n Up if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n Right if-shell "$is_vim" 'send-keys C-t'  'select-pane -R'

bind-key -T copy-mode-vi 'Left' select-pane -L
bind-key -T copy-mode-vi 'Down' select-pane -D
bind-key -T copy-mode-vi 'Up' select-pane -U
bind-key -T copy-mode-vi 'Right' select-pane -R

#######################---Color Theme---##############################

# Status line combined with neovim
set-option -g status-style bg=default
set-option -g status-left-length 99
set-option -g status-right-length 99
set-option -g status-justify "absolute-centre"
set-option -g status-position bottom
###

set -g status on
# only show status bar if there is more then one window
# set-hook -g after-new-window      'if "[ #{session_windows} -gt 1 ]" "set status on"'
# set-hook -g after-kill-pane       'if "[ #{session_windows} -lt 2 ]" "set status off"'
# set-hook -g pane-exited           'if "[ #{session_windows} -lt 2 ]" "set status off"'
# set-hook -g window-layout-changed 'if "[ #{session_windows} -lt 2 ]" "set status off"'

set-option -g status-style bg=default,fg=default
set-option -g status-left ""
set-option -g status-right ""
set-option -g status-left-style none
set-option -g status-right-style none
set-window-option -g window-status-separator ""
set-window-option -g window-status-current-style bg=default,fg=default

# pane border
set-option -g pane-active-border-style fg=colour241 # fg=notInGruvboxPallete
set-option -g pane-border-style fg=colour255 # bg1=notInGruvboxPallete

# message infos (visible while writing command)
set-option -g message-style bg=colour255,fg=colour241 # bg=notInGruvboxPallete, fg=notInGruvboxPallete

# writing commands inactive
set-option -g message-command-style bg=colour124,fg=colour241 # bg=notInGruvboxPallete, fg=notInGruvboxPallete

# pane number display
set-option -g display-panes-active-colour colour241 # notInGruvboxPallete
set-option -g display-panes-colour colour248 # notInGruvboxPallete

set-window-option -g window-status-current-format "#[bg=colour250,fg=colour16,bold,noitalics,nounderscore] #[bg=colour250,fg=colour16] #I |#[bg=colour250,fg=colour16,bold] #W#{?window_zoomed_flag,*Z,} #[bg=colour250,fg=colour16,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=colour235,fg=colour250,bold,noitalics] #[bold,fg=colour250] #I |#[bold,fg=colour250] #W #[fg=colour235,noitalics]"

###############################################################################
###############################################################################

set-option -g renumber-windows on
set-option -g base-index 1

set-option -gas terminal-overrides "*:Tc" # true color support
set-option -gas terminal-overrides "*:RGB" # true color support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
